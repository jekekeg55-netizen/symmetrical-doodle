<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>موقع الفيديوهات</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            background: #222;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 30px auto;
        }

        .video-card {
            background: #222;
            padding: 20px;
            border-radius: 12px;
        }

        .video-card h2 {
            margin-top: 0;
        }

        video {
            width: 100%;
            display: block;
            background: black;
            border-radius: 10px;
        }

        .description {
            color: #ccc;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>🎬 موقع الفيديوهات</h1>
    </header>

    <div class="container">

        <div class="video-card">

            <h2>الفيديو الأول</h2>

            <video controls preload="metadata">
                <source src="video1.mp4" type="video/mp4">
                المتصفح ديالك ما كيدعمش تشغيل الفيديو.
            </video>

            <p class="description">
                مرحباً بكم في موقع الفيديوهات.
            </p>

        </div>

    </div>

</body>
</html>
