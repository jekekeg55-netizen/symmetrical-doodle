<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع الفيديوهات</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        header {
            background: #222;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 15px;
        }

        .video-card {
            background: #222;
            padding: 15px;
            border-radius: 10px;
        }

        .video-card h2 {
            margin-top: 0;
        }

        video {
            display: block;
            width: 100%;
            max-height: 600px;
            border-radius: 8px;
            background: black;
        }

        .description {
            margin-top: 15px;
            color: #ccc;
        }
    </style>
</head>

<body>

    <header>
        <h1>موقع الفيديوهات</h1>
    </header>

    <main class="container">

        <div class="video-card">

            <h2>الفيديو الأول</h2>

            <video controls>
                <source src="videos/video1.mp4" type="video/mp4">
                المتصفح ديالك ما كيدعمش تشغيل الفيديو.
            </video>

            <p class="description">
                هذا هو الفيديو الأول في الموقع.
            </p>

        </div>

    </main>

</body>
</html>
