<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هيمنة العرب | منصة الفيديوهات</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Tahoma, sans-serif;
            background: #0b0b0f;
            color: white;
        }

        header {
            background: #15151c;
            border-bottom: 1px solid #292933;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: auto;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            white-space: nowrap;
        }

        .logo span {
            color: #e63946;
        }

        .search {
            flex: 1;
            max-width: 500px;
        }

        .search input {
            width: 100%;
            padding: 12px 18px;
            border: 1px solid #33333d;
            border-radius: 25px;
            background: #22222b;
            color: white;
            outline: none;
            font-size: 15px;
        }

        .search input:focus {
            border-color: #e63946;
        }

        .container {
            width: 92%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h1 {
            margin: 0 0 8px;
            font-size: 30px;
        }

        .welcome p {
            margin: 0;
            color: #aaa;
        }

        .video-card {
            background: #17171e;
            border: 1px solid #292933;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .video-title {
            padding: 18px 20px 10px;
        }

        .video-title h2 {
            margin: 0;
            font-size: 22px;
        }

        .video-wrapper {
            background: #000;
        }

        video {
            width: 100%;
            max-height: 650px;
            display: block;
            background: #000;
        }

        .info {
            padding: 20px;
        }

        .info p {
            color: #aaa;
            line-height: 1.8;
            margin: 10px 0 0;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            background: #25252f;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        .btn:hover {
            background: #e63946;
        }

        .section-title {
            font-size: 22px;
            margin: 35px 0 18px;
        }

        .videos-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
        }

        .mini-card {
            background: #17171e;
            border: 1px solid #292933;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: 0.2s;
        }

        .mini-card:hover {
            transform: translateY(-3px);
            border-color: #e63946;
        }

        .mini-card img {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            display: block;
        }

        .mini-card h3 {
            font-size: 15px;
            margin: 12px;
        }

        footer {
            margin-top: 50px;
            padding: 25px;
            text-align: center;
            background: #15151c;
            color: #888;
            border-top: 1px solid #292933;
        }

        @media (max-width: 800px) {
            .header-content {
                flex-direction: column;
            }

            .search {
                width: 100%;
                max-width: none;
            }

            .videos-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .container {
                width: 94%;
            }

            .videos-grid {
                grid-template-columns: 1fr;
            }

            .welcome h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="header-content">

        <div class="logo">
            هيمنة <span>العرب</span>
        </div>

        <div class="search">
            <input
                type="search"
                id="searchInput"
                placeholder="🔎 ابحث عن فيديو..."
            >
        </div>

    </div>
</header>

<main class="container">

    <section class="welcome">
        <h1>مرحباً بك في هيمنة العرب</h1>
        <p>شاهد أحدث الفيديوهات في مكان واحد.</p>
    </section>

    <!-- الفيديو 1 -->
    <article class="video-card">

        <div class="video-title">
            <h2>الفيديو الأول</h2>
        </div>

        <div class="video-wrapper">

            <video
                controls
                controlsList="nodownload"
                preload="metadata"
                poster="./video1.jpg"
                oncontextmenu="return false;"
            >
                <source src="./video1.mp4" type="video/mp4">
                المتصفح ديالك ما كيدعمش تشغيل الفيديو.
            </video>

        </div>

        <div class="info">

            <p>
                شاهد الفيديو الأول على منصة هيمنة العرب.
            </p>

            <div class="actions">

                <button class="btn" onclick="likeVideo()">
                    ❤️ إعجاب
                </button>

                <button class="btn" onclick="shareVideo()">
                    🔗 مشاركة
                </button>

            </div>

        </div>

    </article>

    <!-- الفيديوهات -->
    <h2 class="section-title">🎬 أحدث الفيديوهات</h2>

    <section class="videos-grid" id="videosGrid">

        <div class="mini-card" data-title="الفيديو الأول">
            <img src="./video1.jpg" alt="الفيديو الأول">
            <h3>الفيديو الأول</h3>
        </div>

        <div class="mini-card" data-title="الفيديو الثاني">
            <img src="./video2.jpg" alt="الفيديو الثاني">
            <h3>الفيديو الثاني</h3>
        </div>

    </section>

</main>

<footer>
    © 2026 هيمنة العرب — جميع الحقوق محفوظة
</footer>

<script>

    function likeVideo() {
        alert("شكراً على إعجابك ❤️");
    }

    function shareVideo() {

        if (navigator.share) {

            navigator.share({
                title: "هيمنة العرب",
                text: "شاهد هذا الفيديو على هيمنة العرب",
                url: window.location.href
            });

        } else {

            navigator.clipboard.writeText(window.location.href);

            alert("تم نسخ رابط الموقع 🔗");

        }
    }

    const searchInput = document.getElementById("searchInput");

    const cards = document.querySelectorAll(".mini-card");

    searchInput.addEventListener("input", function () {

        const search = this.value.toLowerCase().trim();

        cards.forEach(function(card) {

            const title = card
                .getAttribute("data-title")
                .toLowerCase();

            if (title.includes(search)) {

                card.style.display = "";

            } else {

                card.style.display = "none";

            }

        });

    });

</script>

</body>
</html>
